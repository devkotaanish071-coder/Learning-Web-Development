<!DOCTYPE html>
<html>
    <head>
        <title>Objects</title>
    </head>
    <body>
        <script>
            const product = {
                name : 'Boots',
                price : 1000
            };
            console.log(product);
            console.log(product.name);
            console.log(product.price);

            product.name = 'Leather Boots';
            console.log(product);

            product.size = 10;
            console.log(product);

            delete product.price;
            console.log(product);
        </script>
    </body>
</html>
