<!DOCTYPE html>
<html>
    <head>
        <title>DOMS Projects</title>
    </head>
    <body>

        <p>YouTube Subscribe Button</p>
        <button onclick = "
            subscribe();
        " class = "js-subscribe-button">Subscribe</button>

        <p>Amazon Shipping Calculator</p>
        <p>Orders under $40 = +$10 shipping.</p>
        <p>Orders over $40 = FREE shipping.</p>

        <input placeholder = "Cost of Order" class = "js-cost-input"
            onkeydown = "handleEnterKey();
        ">

        <button onclick = "
            calculateTotal();
        ">Calculate</button>
        <p class = "js-show-total"></p>

        <script>

            function handleEnterKey(){
                if(event.key === 'Enter'){
                    calculateTotal();
                }
            }

            function calculateTotal(){
                const costElement = document.querySelector('.js-cost-input');
                let cost = Number(costElement.value);
                if(cost < 40){
                    cost = cost + 10;
                }

                document.querySelector('.js-show-total').innerHTML = `$${cost}`;
            }

            function subscribe(){
                const buttonElement = document.querySelector('.js-subscribe-button');

                if(buttonElement.innerText === 'Subscribe'){
                    buttonElement.innerHTML = 'Subscribed';
                }else{
                    buttonElement.innerHTML = 'Subscribe';
                }                    
            }

        </script>
    </body>
</html>
