 <!DOCTYPE html>
 <html>
    <head>
        <title>Advanced JavaScript Functions</title>
    </head>
    <body>
        <script>
            function greeting(){
                console.log(`Good Morning!`);
            }
            greeting();
            const num = 2;
            const function1 = function(){
                console.log(`Love You`);
            }
            console.log(function1);
            function1();

            const object1 = {
                num: 2,
                fun: function(){
                    console.log(`Hello Guys`);
                }
            };
            object1.fun();

            function display(p){
                console.log(p);
            }
            display(4);

            function run(p){
                p();
            }
            run(function(){
                console.log(`Hello Universe`);
            });
        </script>
    </body>
 </html>
