<!DOCTYPE html>
<html>
    <head>
        <title>DOMS Projects</title>
        <style>
            body{
                font-family: Arial;
            }

            .subscribe-button{
                background-color: black;
                color: white;
                border: none;
                padding: 10px 15px;
                border-radius: 20px;
                font-weight: bold;
                cursor: pointer;
                margin-bottom: 40px;
            }

            .is-subscribed{
                background-color: rgb(240, 240, 240);
                color: black;
            }

            .cost-input{
                font-size: 15px;
                padding: 10px;
            }

            .show-total{
                background-color: green;
                color: white;
                border: none;
                font-size: 15px;
                padding: 12px 15px;
                cursor: pointer;
                
            }
        </style>
    </head>
    <body>

        <p>YouTube Subscribe Button</p>
        <button onclick = "
            subscribe();
        " class = "js-subscribe-button subscribe-button">Subscribe</button>

        <p>Amazon Shipping Calculator</p>
        <p>Orders under $40 = +$10 shipping.</p>
        <p>Orders over $40 = FREE shipping.</p>

        <input placeholder = "Cost of Order" class = "js-cost-input cost-input"
            onkeydown = "handleEnterKey();
        ">

        <button onclick = "
            calculateTotal();
        " class = "show-total">Calculate</button>
        <p class = "js-show-total"></p>

        <script>

            function handleEnterKey(){
                if(event.key === 'Enter'){
                    calculateTotal();
                }
            }

            function calculateTotal(){
                const costElement = document.querySelector('.js-cost-input');
                let cost = Number(costElement.value);
                if(cost < 40){
                    cost = cost + 10;
                }

                document.querySelector('.js-show-total').innerHTML = `$${cost}`;
            }

            function subscribe(){
                const buttonElement = document.querySelector('.js-subscribe-button');

                if(buttonElement.innerText === 'Subscribe'){
                    buttonElement.innerHTML = 'Subscribed';
                    buttonElement.classList.add('is-subscribed');
                }else{
                    buttonElement.innerHTML = 'Subscribe';
                    buttonElement.classList.remove('is-subscribed');
                }                    
            }

        </script>
    </body>
</html>
