<!DOCTYPE html>
<html>
     <head>
        <title>Grid Practice</title>
     </head>
     <body style = "padding-bottom: 500px;">
        <div style = "display: grid; grid-template-columns: 100px 200px;">
            <div style = "background-color: aqua;">div 1</div>
            <div style = "background-color: aquamarine;">div 2</div>
        </div>

        <div style = "margin-top: 30px;  display: grid; grid-template-columns: 100px 200px 300px;">
            <div style = "background-color: aqua;">100px</div>
            <div style = "background-color: aquamarine;">200px</div>
            <div style = "background-color: rgb(77, 156, 129);">300px</div>
            <div style = "background-color: rgb(41, 72, 72);">100px</div>
        </div>

        <div style = "margin-top: 30px;  display: grid; grid-template-columns: 100px 1fr;">
            <div style = "background-color: aqua;">100px</div>
            <div style = "background-color: aquamarine;">1fr</div>
        </div>

        <div style = "margin-top: 30px;  display: grid; grid-template-columns: 100px 1fr 2fr;">
            <div style = "background-color: aqua;">100px</div>
            <div style = "background-color: aquamarine;">1fr</div>
            <div style = "background-color: rgb(64, 118, 100);">2fr</div>
        </div>

        <div style = "column-gap: 20px; row-gap: 20px;  margin-top: 30px;  display: grid; grid-template-columns: 1fr 1fr 1fr;">
            <div style = "height: 300px;  background-color: aqua;">1fr</div>
            <div style = "height: 300px;  background-color: aquamarine;">1fr</div>
            <div style = "height: 300px;  background-color: aqua;">1fr</div>
            <div style = "height: 300px;  background-color: aquamarine;">1fr</div>
            <div style = "height: 300px;  background-color: aqua;">1fr</div>
            <div style = "height: 300px;  background-color: aquamarine;">1fr</div>
        </div>

     </body>
</html>
