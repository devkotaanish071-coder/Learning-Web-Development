<!DOCTYPE html>
<html>
    <head>
        <title>Buttons</title>
        <link rel = "stylesheet" href = "../02-CSS/buttons.css">

        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

    </head>
    <body>
        <a href = "https://www.youtube.com" target = "_blank"><button class = "Subscribe_button">SUBSCRIBE </button></a>
        <button class = "Join_button" >JOIN</button>
        <button class = "Twitwer_button" >Tweet</button>

        <br>
        <hr>
        <p class = "model" >Model 3</p>
        <p class = "order" >Order Online for <span class = "touch" >Touchless Delivery</span></p>

        <br>
        <br>
        <p class = "email" >Email</p>
        <input class = "mail" type = "email" placeholder = "john123@gamil.com">
        <p class = "agree" >By clicking Agree & Join, you agree to the Privacy Policy.</p>
        <button class = "jon" >Agree & Join</button>

        <br>
        <br>
        <input class = "first" type = "text" placeholder = "First Name">
        <input class = "last" type = "text" placeholder = "Last Name">
        <br>
        <input class = "mall" type = "email" placeholder = "Email">
        <br>
        <button class = "sign" >Sign Up</button>
    </body>
</html>
