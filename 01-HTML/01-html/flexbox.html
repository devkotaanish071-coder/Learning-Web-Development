<!DOCTYPE html>
<html>
    <head>
        <title>Flexbox</title>
    </head>
    <body style = "padding-bottom: 500px;">
        <div style = "display: flex;  flex-direction: row;">
            <div style = "background-color: lightblue;">Div 1 is good</div>
            <div style = "background-color: lightpink;">Div 2 <p>Hello World</p></div>
        </div>

        <div style = "margin-top: 30px; display: flex;  flex-direction: row;">
            <div style = "background-color: lightblue; width:100px;">100px</div>
            <div style = "background-color: lightpink; flex: 1;">Flex: 1</div>
        </div>

        <div style = "margin-top: 30px; display: flex;  flex-direction: row;">
            <div style = "background-color: lightblue; width:100px;">100px</div>
            <div style = "background-color: lightpink; flex: 1;">Flex: 1</div>
            <div style = "background-color: lightblue; flex: 2;">Flex: 2</div>
        </div>

        <div style = "margin-top: 30px; display: flex;  flex-direction: row; height: 70px; border-width: 1px; border-color: grey; border-style: solid; justify-content: center;">
            <div style = "background-color: lightblue; width:100px;">100px</div>
            <div style = "background-color: lightpink; width: 100px;">100px</div>
            <div style = "background-color: lightblue; width: 100px;">100px</div>
        </div>

        <div style = "margin-top: 30px; display: flex;  flex-direction: row; height: 70px; border-width: 1px; border-color: grey; border-style: solid; justify-content: space-between;">
            <div style = "background-color: lightblue; width:100px;">100px</div>
            <div style = "background-color: lightpink; width: 100px;">100px</div>
            <div style = "background-color: lightblue; width: 100px;">100px</div>
        </div>

        <div style = "margin-top: 30px; display: flex;  flex-direction: row; height: 70px; border-width: 1px; border-color: grey; border-style: solid; justify-content: space-between; align-items: center;">
            <div style = "background-color: lightblue; width:100px;">100px</div>
            <div style = "background-color: lightpink; width: 100px;">100px</div>
            <div style = "background-color: lightblue; width: 100px;">100px</div>
        </div>
    </body>
</html>
