<!DOCTYPE html>
<html>
    <head>
        <title>Flexbox</title>
    </head>
    <body style = "padding-bottom: 500px;">
        <div style = "display: flex;  flex-direction: row;">
            <div style = "background-color: lightblue;">Div 1 is good</div>
            <div style = "background-color: lightpink;">Div 2 <p>Hello World</p></div>
        </div>

        <div style = "margin-top: 30px; display: flex;  flex-direction: row;">
            <div style = "background-color: lightblue; width:100px;">100px</div>
            <div style = "background-color: lightpink; flex: 1;">Flex: 1</div>
        </div>

        <div style = "margin-top: 30px; display: flex;  flex-direction: row;">
            <div style = "background-color: lightblue; width:100px;">100px</div>
            <div style = "background-color: lightpink; flex: 1;">Flex: 1</div>
            <div style = "background-color: lightblue; flex: 2;">Flex: 2</div>
        </div>

        <div style = "margin-top: 30px; display: flex;  flex-direction: row; height: 70px; border-width: 1px; border-color: grey; border-style: solid; justify-content: center;">
            <div style = "background-color: lightblue; width:100px;">100px</div>
            <div style = "background-color: lightpink; width: 100px;">100px</div>
            <div style = "background-color: lightblue; width: 100px;">100px</div>
        </div>

        <div style = "margin-top: 30px; display: flex;  flex-direction: row; height: 70px; border-width: 1px; border-color: grey; border-style: solid; justify-content: space-between;">
            <div style = "background-color: lightblue; width:100px;">100px</div>
            <div style = "background-color: lightpink; width: 100px;">100px</div>
            <div style = "background-color: lightblue; width: 100px;">100px</div>
        </div>

        <div style = "margin-top: 30px; display: flex;  flex-direction: row; height: 70px; border-width: 1px; border-color: grey; border-style: solid; justify-content: space-between; align-items: center;">
            <div style = "background-color: lightblue; width:100px;">100px</div>
            <div style = "background-color: lightpink; width: 100px;">100px</div>
            <div style = "background-color: lightblue; width: 100px;">100px</div>
        </div>

        <!-- Hamburger Menu Icon (3 Lines) -->
        <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor">
        <path d="M21 6H3V5h18v1zm0 5H3v1h18v-1zm0 6H3v1h18v-1z"></path>
        </svg> 

        <!-- Home Icon -->
        <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor">
            <path d="M4 21V10.08l8-6.92 8 6.92V21h-7v-6h-2v6H4z"></path>
        </svg>

        <!-- Shorts Icon -->
        <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor">
            <path d="M10 14.65v-5.3L15 12l-5 2.65zm7.77-5.33c-.77-.32-1.27-.32-1.27-.32l1.09-.64c1.47-.87 1.96-2.75 1.1-4.21a3.024 3.024 0 00-4.17-1.12l-6.84 4.05C6.46 7.68 5.75 9.17 5.75 10.8c0 1.62.71 3.12 1.94 3.92l.64.42-.64.38c-1.47.87-1.96 2.75-1.1 4.21.57.97 1.58 1.54 2.64 1.54.52 0 1.05-.13 1.53-.42l7.53-4.46c1.19-.7 1.91-1.98 1.91-3.36a3.94 3.94 0 00-2.43-3.67z"></path>
        </svg>

        <!-- Subscriptions Icon -->
        <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor">
            <path d="M20 7H4V6h16v1zm2 3H2v1h20v-1zm-2 4H4v7h16v-7zm-3 3.5l-5 3v-6l5 3z"></path>
        </svg>

        <!-- Library Icon -->
        <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor">
            <path d="M4 6H2v14c0 1.1.9 2 2 2h14v-2H4V6zm16-4H8c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-8 12.5v-9l6 4.5-6 4.5z"></path>
        </svg>

    </body>
</html>
